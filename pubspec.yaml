name: motometer
description: A privacy-focused digital motorcycle dashboard and fuel manager.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^6.0.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.2
  sqlite3_flutter_libs: ^0.5.18
  path: ^1.8.3
  intl: ^0.18.1
  http: ^1.1.0
  google_fonts: ^6.1.0
  provider: ^6.0.5
  share_plus: ^12.0.1
  path_provider: ^2.1.5
  wakelock_plus: ^1.2.8
  file_picker: ^10.3.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
